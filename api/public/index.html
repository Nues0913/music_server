<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>新增歌曲 · 遠端曲庫</title><link rel="stylesheet" href="/admin/style.css">
  <script src="/admin/app.js" type="module"></script>
</head>
<body>
  <header><a href="/admin" class="brand"><span class="mark">♫</span> 遠端曲庫</a><span class="badge">管理者上傳</span></header>
  <main>
    <p class="eyebrow">YOUR MUSIC LIBRARY</p>
    <h1>把喜歡的歌，<br>加入你的曲庫。</h1>
    <p class="intro">一次選擇多首音檔，確認各首歌曲資訊，上傳後即可在曲庫搜尋。</p>
    <form id="upload-form">
      <section class="card">
        <div class="section-heading"><span class="step">01</span><h2>選擇歌曲</h2></div>
        <label id="drop-zone" class="drop-zone" for="file">
          <span class="upload-icon" aria-hidden="true">↑</span>
          <strong id="file-label">拖曳多首音檔到這裡，或點選檔案</strong>
          <span id="file-detail">MP3、FLAC、WAV、OGG、Opus、M4A、WebM</span>
          <input id="file" name="file" type="file" accept=".mp3,.flac,.wav,.ogg,.opus,.m4a,.webm" multiple>
        </label>
        <p id="limit" class="hint">正在讀取上傳限制…</p>
        <ol id="file-list" class="file-list" aria-label="歌曲上傳清單"></ol>
      </section>
      <section class="card">
        <div class="section-heading"><span class="step">02</span><h2>管理者驗證</h2></div>
        <label for="token">上傳金鑰<input id="token" type="password" minlength="32" required autocomplete="off" spellcheck="false" placeholder="輸入 ADMIN_TOKEN"></label>
        <div class="token-note"><span class="hint">金鑰只用於本次頁面，不儲存在瀏覽器。</span><button id="clear-token" type="button" class="text-button">清除金鑰</button></div>
      </section>
      <section class="result" aria-live="polite" aria-atomic="true">
        <p id="status">準備好後，按下「上傳歌曲」。</p>
        <progress id="progress" max="100" value="0" hidden></progress>
        <p id="song-result" class="hint"></p>
      </section>
      <div class="actions"><button id="cancel" type="button" class="secondary" hidden>取消批次</button><button id="submit" type="submit" disabled>上傳歌曲 <span aria-hidden="true">↗</span></button></div>
    </form>
    <footer>歌曲依序上傳，相同音檔不會重複加入。再次上傳只會重試失敗或未完成的歌曲；重新選檔會替換清單。</footer>
  </main>
</body>
</html>
